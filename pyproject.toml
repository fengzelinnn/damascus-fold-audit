[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "damascus-fold-audit"
version = "0.3.0"
description = "Frozen-manuscript Damascus Fold protocol, feasibility and A-group experiment workbench"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
plots = [
  "matplotlib==3.10.8", "python-pptx==1.0.2", "numpy==2.3.5",
  "contourpy==1.3.3", "cycler==0.12.1", "fonttools==4.61.1",
  "kiwisolver==1.4.9", "packaging==26.3", "pillow==12.3.0",
  "pyparsing==3.3.2", "python-dateutil==2.9.0.post0", "six==1.17.0",
  "lxml==6.1.1", "typing_extensions==4.16.0", "xlsxwriter==3.2.9"
]

[project.scripts]
damascus-a = "damascus_a.cli:main"

[tool.setuptools.packages.find]
include = ["damascus_a*"]
